[pytest]
# Put code/ on the import path so tests can `import config` the same way
# main.py does.
pythonpath = code
testpaths = tests
# The end-to-end run of main.py takes several minutes, so it is marked "slow" and
# skipped by default. Run it with:  pytest -m slow
markers =
    slow: runs the whole pipeline end to end (several minutes)
addopts = -m "not slow"
